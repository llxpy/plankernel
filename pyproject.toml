[project]
name = "panhub-kbengine"
version = "1.0.0"
description = "盘枢 Knowledge Base Engine — 目录级本地 RAG 中台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.40",
    "jieba>=0.42",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "docx2txt>=0.8",
    "openpyxl>=3.1",
    "keyring>=25",
    "cryptography>=42",
    "filelock>=3.13",
    "pywebview>=5.3",
    "pythonnet>=3.0; sys_platform == 'win32'",
    "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3",
    "ruff>=0.6",
    "mypy>=1.10",
    "hypothesis>=6",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]
